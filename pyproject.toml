[project]
name = "dackar"
version = "0.1.0"
description = "Digital Analytics, Causal Knowledge Acquisition and Reasoning"
readme = "README.md"
license = {file="LICENSE"}
requires-python = ">=3.11"
dependencies = [
  "setuptools<82",
  # Core NLP. Unified on spaCy 3.8 (pydantic v2): the pinned en_core_web_lg 3.8
  # model and the regenerated test fixtures require 3.8, so upstream's
  # "spacy==3.5; python<3.12" pin is dropped as incompatible. coreferee is also
  # dropped (it hard-requires spacy<3.6 and is already runtime-inactive).
  "spacy==3.8.*",
  "en-core-web-lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl",
  "stumpy",
  "textacy",
  "matplotlib",
  # Pinned to 3.8.1: nltk 3.9+ renamed corpora (punkt->punkt_tab,
  # averaged_perceptron_tagger->..._eng), which scripts/bootstrap_models.py
  # downloads under the old names. 3.8.1 keeps the bootstrap and fixtures working.
  "nltk==3.8.1",
  "beautifulsoup4",
  "networkx",
  "pysbd",
  "tomli",
  "toml",
  "numerizer",
  "autocorrect",
  "contextualSpellCheck",
  # Floor at 1.3 (not upstream's <1.3): pywsd >=1.3 disambiguates via the `wn`
  # library (Open English WordNet), the backend the similarity test golden values
  # were regolded against. <1.3 reverts to nltk-WordNet and breaks those tests.
  # An explicit floor is required: bare `pywsd` lets uv keep a stale 1.2.x already
  # in the venv, since it satisfies an unpinned constraint.
  "pywsd>=1.3",
  "openpyxl",
  "quantulum3[classifier]",
  "numpy==1.26; python_version < \"3.12\"",
  "numpy; python_version >= \"3.12\"",
  "scikit-learn",
  "pyspellchecker",
  "python-dateutil",
  "pandas",
  "wordcloud",
  "jsonschema",
  "cytoolz",
  "neo4j",
  "jupyterlab",
  "pytest",
  "plotly",
  "xlrd",
  # Torch: CPU builds routed via [tool.uv.sources]; Windows pinned for pytorch #166628
  "torch==2.9.1 ; platform_system != 'Windows'",
  "torch==2.8.0 ; platform_system == 'Windows'",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/idaholab/DACKAR"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]


[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "platform_system != 'Windows'" },
  { index = "pytorch-cpu-win", marker = "platform_system == 'Windows'" },
]

# Two named indexes pointing at the same URL because uv applies an index
# selection per source, not per marker. The platform markers in
# [tool.uv.sources] then route to the right named index per OS.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu-win"
url = "https://download.pytorch.org/whl/cpu"
explicit = true


[dependency-groups]
# Optional NLP pipes. pywsd is guarded by lazy/conditional imports in
# similarity/synsetUtils.py. coreferee was removed: it pinned spaCy <3.6 (the
# pydantic-v1 ceiling) and was already inactive at runtime (its gate is spaCy <=3.3).
nlp-extra = [
  "contextualSpellCheck",
  "pywsd>=1.3",
  "autocorrect",
  "pyspellchecker",
]

# AI-enhanced RCA stack (src/dackar/RCA/demos and orchestrators).
# Resolves against pydantic v2 (spaCy 3.8). langchain 1.x is the pydantic-v2 line.
rca = [
  "langchain-core",
  "langchain-community",
  "langchain-chroma",
  "chromadb",
  "pdfplumber",
  "streamlit",
  "nbformat",
  "requests",
  # PDF parsing (dackar.RCA.doc_parsers.pdfParser). Compatible with spaCy 3.8 / pydantic v2.
  "marker-pdf",
  # Small spaCy model needed by RCA/ner/hybrid_ner/generators/nounphrase_generator.py
  # (hardcoded spacy.load("en_core_web_sm"); no lg fallback). URL-pinned to match the
  # en_core_web_lg version in core deps.
  "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

# Anomaly detection (dackar.anomalies). scikit-learn already pulled in by core via quantulum3[classifier].
anomaly = [
  "stumpy",
]

# Neo4j knowledge-graph backend (dackar.knowledge_graph).
kg = [
  "neo4j",
  "graphdatascience",
]

# Word-cloud rendering in dackar.utils.visualize.
viz = [
  "wordcloud",
]

# Documentation build (cd docs && make html).
docs = [
  "sphinx",
  "sphinx_rtd_theme",
  "nbsphinx",
  "sphinx-copybutton",
  "sphinx-autoapi",
]

# Tests and notebook examples.
dev = [
  "pytest",
  "jupyterlab",
]

