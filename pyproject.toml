[project]
name = "dackar"
version = "0.1.0"
description = "Digital Analytics, Causal Knowledge Acquisition and Reasoning"
readme = "README.md"
license = {file="LICENSE"}
requires-python = ">=3.11"
dependencies = [
  "setuptools<82",
  "spacy==3.5; python_version < \"3.12\"",
  "spacy==3.8; python_version >= \"3.12\"",
  "stumpy",
  # Core NLP — exact versions match CI's known-good install
  "spacy==3.5.*",
  "en-core-web-lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.5.0/en_core_web_lg-3.5.0-py3-none-any.whl",
  "numpy>=1.26,<2",
  "pandas",
  "pysbd",
  "quantulum3[classifier]",
  "scikit-learn",
  "textacy",
  "numerizer",
  "networkx",
  "nltk==3.8.1; python_version < \"3.12\"",
  "beautifulsoup4",
  "networkx",
  "pysbd",
  "tomli",
  "toml",
  "numerizer",
  "autocorrect",
  "contextualSpellCheck",
  "pywsd<1.3",
  "openpyxl",
  "quantulum3[classifier]",
  "numpy==1.26; python_version < \"3.12\"",
  "numpy; python_version >= \"3.12\"",
  "matplotlib",
  "scikit-learn",
  "pyspellchecker",
  "python-dateutil",
  "pandas",
  "wordcloud",
  "jsonschema",
  "cytoolz",
  "neo4j",
  "jupyterlab",
  "pytest",
  "plotly",
  "xlrd"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering"
  # Torch: platform-specific pins (Windows fix for pytorch issue #166628)
  "torch==2.9.1 ; platform_system != 'Windows'",
  "torch==2.8.0 ; platform_system == 'Windows'",
]

[project.urls]
Homepage = "https://github.com/idaholab/DACKAR"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]


[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "platform_system != 'Windows'" },
  { index = "pytorch-cpu-win", marker = "platform_system == 'Windows'" },
]

# Two named indexes pointing at the same URL because uv applies an index
# selection per source, not per marker. The platform markers in
# [tool.uv.sources] then route to the right named index per OS.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu-win"
url = "https://download.pytorch.org/whl/cpu"
explicit = true


[dependency-groups]
# Optional NLP pipes. coreferee and pywsd are already guarded by lazy/conditional
# imports in src/dackar/pipelines/CustomPipelineComponents.py and similarity/synsetUtils.py
nlp-extra = [
  "coreferee",
  "contextualSpellCheck",
  "pywsd",
  "autocorrect",
  "pyspellchecker",
  # setuptools 80+ dropped pkg_resources, which coreferee 1.4.1 still imports.
  "setuptools<80",
  # coreferee's install step calls `python -m pip install`; uv venvs omit pip by default.
  "pip",
]

# AI-enhanced RCA stack (src/dackar/RCA/demos and orchestrators).
# The langchain stack resolves to pydantic-v1-compatible versions
# naturally because spaCy 3.5 and quantulum3 hold the resolver to
# pydantic <2. Add explicit upper bounds here if those pins move.
rca = [
  "langchain-core",
  "langchain-community",
  "langchain-chroma",
  "chromadb",
  "pdfplumber",
  "streamlit",
  "nbformat",
  "requests",
]

# Anomaly detection (dackar.anomalies). scikit-learn already pulled in by core via quantulum3[classifier].
anomaly = [
  "stumpy",
]

# Neo4j knowledge-graph backend (dackar.knowledge_graph).
kg = [
  "neo4j",
  "graphdatascience",
]

# Word-cloud rendering in dackar.utils.visualize.
viz = [
  "wordcloud",
]

# Documentation build (cd docs && make html).
docs = [
  "sphinx",
  "sphinx_rtd_theme",
  "nbsphinx",
  "sphinx-copybutton",
  "sphinx-autoapi",
]

# Tests and notebook examples.
dev = [
  "pytest",
  "jupyterlab",
]

