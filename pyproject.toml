[project]
name = "dackar"
version = "0.1.0"
description = "Digital Analytics, Causal Knowledge Acquisition and Reasoning"
readme = "README.md"
license = {file="LICENSE"}
requires-python = ">=3.11"
dependencies = [
  "setuptools<82",
  "spacy==3.5; python_version < \"3.12\"",
  "spacy==3.8; python_version >= \"3.12\"",
  "stumpy",
  # Core NLP — exact versions match CI's known-good install
  "spacy==3.5.*",
  "en-core-web-lg @ https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.5.0/en_core_web_lg-3.5.0-py3-none-any.whl",
  "numpy>=1.26,<2",
  "pandas",
  "pysbd",
  "quantulum3[classifier]",
  "scikit-learn",
  "textacy",
  "numerizer",
  "networkx",
  "nltk==3.8.1; python_version < \"3.12\"",
  "beautifulsoup4",
  "networkx",
  "pysbd",
  "tomli",
  "toml",
  "numerizer",
  "autocorrect",
  "contextualSpellCheck",
  "pywsd<1.3",
  "openpyxl",
  "quantulum3[classifier]",
  "numpy==1.26; python_version < \"3.12\"",
  "numpy; python_version >= \"3.12\"",
  "matplotlib",
  "scikit-learn",
  "pyspellchecker",
  "python-dateutil",
  "pandas",
  "wordcloud",
  "jsonschema",
  "cytoolz",
  "neo4j",
  "jupyterlab",
  "pytest",
  "plotly",
  "xlrd"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering"
]

[project.urls]
Homepage = "https://github.com/idaholab/DACKAR"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
