[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dackar"
version = "0.1.0"
authors = [
  { name="Diego Mandelli", email="diego.mandelli@inl.gov" },
  { name="Congjian Wang", email="congjian.wang@inl.gov" },
  { name="Joshua J. Cogliati", email="joshua.cogliati@inl.gov" },
]
description = "Digital Analytics, Causal Knowledge Acquisition and Reasoning"
readme = "README.md"
license = {file="LICENSE"}
requires-python = ">=3.11"
dependencies = [
  "setuptools<82",
  "spacy==3.5; python_version < \"3.12\"",
  "spacy==3.8; python_version >= \"3.12\"",
  "stumpy",
  "textacy",
  "matplotlib",
  "nltk",
  "coreferee; python_version < \"3.12\"",
  "beautifulsoup4",
  "networkx",
  "pysbd",
  "tomli",
  "toml",
  "numerizer",
  "autocorrect",
  "contextualSpellCheck",
  "pywsd<1.3",
  "openpyxl",
  "quantulum3[classifier]",
  "numpy==1.26; python_version < \"3.12\"",
  "numpy; python_version >= \"3.12\"",
  "scikit-learn",
  "pyspellchecker",
  "pandas",
  "wordcloud",
  "jsonschema",
  "cytoolz",
  "neo4j",
  "jupyterlab",
  "pytest",
  "plotly",
  "xlrd"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering"
]

[project.urls]
"Homepage" = "https://github.com/idaholab/DACKAR"
