[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "outage-canonical-model"
version = "0.1.0"
description = "Starter package for a canonical outage schedule model"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "DACKAR" }
]
dependencies = [
  "pandas>=2.0",
  "pydantic>=2.5"
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
