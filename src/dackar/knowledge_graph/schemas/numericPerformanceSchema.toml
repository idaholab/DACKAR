title = "Numeric Performance Record Graph Schema"
version = "1.0"

# ============================================================
# NODE ENTITIES
# ============================================================

[node.anomaly]
node_description = "Represents a specific occurrence of an anomaly, such as threshold violations, signal deviations, or unexpected patterns, associated with a particular component, equipment, or system that have been detected by monitoring sensors coupled with an anomaly detection algorithm."
node_properties = [
  { name = "id", type = "string", optional = false, description = "Stable unique identifier for the anomaly." },
  { name = "t_detection", type = "string", optional = false, description = "The timestamp marking the moment the system first identified the presence of an anomaly." },
  { name = "t_final", type = "string", optional = true, description = "The timestamp indicating when the system no longer identified the anomaly as present." }
]

[node.diagnostic_assessment]
node_description = "Represents an evaluation of the current health or operational state of a system, component, or equipment, typically based on observed data, anomalies, and expert or algorithmic reasoning."
node_properties = [
  { name = "id", type = "string", optional = false, description = "Stable unique identifier for the diagnostic assessment." },
  { name = "timestamp", type = "string", optional = false, description = "Time when the diagnostic assessment was performed." },
  { name = "method", type = "string", optional = true, description = "Method or algorithm used for the diagnostic assessment." },
  { name = "result", type = "string", optional = false, description = "Summary of the diagnostic conclusion, such as fault detected or normal operation." },
  { name = "confidence", type = "float", optional = true, description = "Confidence level or probability associated with the diagnostic result." }
]

[node.prognostic_assessment]
node_description = "Represents a prediction about the future health, performance, or failure likelihood of a system or component, based on current data, degradation models, or predictive analytics."
node_properties = [
  { name = "id", type = "string", optional = false, description = "Stable unique identifier for the prognostic assessment." },
  { name = "timestamp", type = "string", optional = false, description = "Time when the prognostic assessment was performed." },
  { name = "method", type = "string", optional = true, description = "Method or model used for the prognostic assessment." },
  { name = "predicted_failure_time", type = "string", optional = true, description = "Estimated time of failure or performance degradation." },
  { name = "remaining_useful_life", type = "float", optional = true, description = "Estimated remaining useful life in hours, days, or other applicable units." },
  { name = "confidence", type = "float", optional = true, description = "Confidence level or uncertainty associated with the prediction." }
]

# ============================================================
# RELATIONS
# ============================================================

[relation.detected_by]
relation_description = "Defines a semantic relationship indicating that a detected anomaly was identified through the observation or analysis of a specific monitoring variable. This link establishes traceability between the anomaly instance and the physical variable that triggered its detection."
from_entity = "anomaly"
to_entity = "monitored_variable"

[relation.diagnoses]
relation_description = "Indicates that a diagnostic assessment is associated with a specific anomaly."
from_entity = "diagnostic_assessment"
to_entity = "anomaly"

[relation.prognosticates]
relation_description = "Indicates that a prognostic assessment is associated with a specific installed plant element, predicting its future state."
from_entity = "prognostic_assessment"
to_entity = "element_usage"

[relation.diagnostic_based_on]
relation_description = "Indicates that a diagnostic assessment is based on data from a monitored variable."
from_entity = "diagnostic_assessment"
to_entity = "monitored_variable"

[relation.prognostic_based_on]
relation_description = "Indicates that a prognostic assessment is based on data from a monitored variable."
from_entity = "prognostic_assessment"
to_entity = "monitored_variable"

[relation.detected_as]
relation_description = "Indicates that a sensor-detected anomaly has been identified as a manifestation of a documented condition report, establishing the link between numeric performance monitoring and operational event records."
from_entity = "anomaly"
to_entity = "condition_report"
relation_properties = [
  { name = "confidence", type = "enum", optional = true, description = "Confidence level of the association between the anomaly and the condition report.", enum_values = ["low", "medium", "high"] }
]
