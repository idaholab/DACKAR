title = "System Simulation Schema"
version = "1.1"

# ====================
# Node Entities
# ====================


[rca_case]
node_description = """Represents a structured investigation into the root causes of an observed abnormal condition, failure, or event. 
                      It includes hypotheses, evidence, conclusions, and recommended actions."""

properties = [
  { name = "rca_id", type = "string", description = "RCA id", required = true },
  { name = "event_id", type = "string", description = "Linked abnormal_event id", required = true },
  { name = "summary", type = "string", description = "Summary text", required = false },
  { name = "kg_paths", type = "array", description = "KG path ids used", required = false },
  { name = "primary_hypothesis", type = "string", description = "Primary hypothesis", required = false },
  { name = "alternatives", type = "array", description = "Alternative hypotheses", required = false },
  { name = "evidence_refs", type = "array", description = "Supporting doc refs", required = false },
  { name = "analyst_ids", type = "array", description = "Analyst ids", required = false },
  { name = "signoffs", type = "array", description = "Signoff records", required = false },
  { name = "created_at", type = "string", description = "ISO timestamp", required = false }
]

[causal_factor]
node_description = """Represents a contributing factor identified during the RCA process, which may be technical, human, organizational, or environmental."""

properties = [
  { name = "factor_id", type = "string", description = "Factor id", required = true },
  { name = "description", type = "string", description = "Narrative", required = false },
  { name = "confidence", type = "object", description = "Structured confidence", required = false },
  { name = "evidence_refs", type = "array", description = "doc_id:section list", required = false }
]

[corrective_action]
node_description = """Represents a proposed or implemented action intended to eliminate or mitigate the root cause or contributing factors."""

properties = [
  { name = "action_id", type = "string", description = "Action id", required = true },
  { name = "description", type = "string", description = "Action description", required = false },
  { name = "owner", type = "string", description = "Owner", required = false },
  { name = "impact_estimate", type = "string", description = "Impact (HIGH/MEDIUM/LOW)", enum = ["HIGH","MEDIUM","LOW"], required = false },
  { name = "effort_estimate", type = "string", description = "Effort estimate", required = false },
  { name = "followup_metrics", type = "array", description = "Metrics to monitor", required = false },
  { name = "implementation_status", type = "string", description = "Status", enum = ["planned","in_progress","done"], required = false }
]


# ====================
# Relationships
# ====================


[investigates]
relation_description = """Indicates that the RCA case is investigating a specific condition report or event."""
from_node = "rca_case"
to_node = "condition_report"

[identifies_causal_factor]
relation_description = """Indicates that the RCA case has identified a specific causal factor."""
from_node = "rca_case"
to_node = "causal_factor"

[recommends_action]
relation_description = """Indicates that the RCA case recommends a specific corrective action."""
from_node = "rca_case"
to_node = "corrective_action"

[addresses_causal_factor]
relation_description = """Indicates that a corrective action is intended to mitigate or eliminate a specific causal factor."""
from_node = "corrective_action"
to_node = "causal_factor"

[related_work_order]
relation_description = """Links a corrective action to a work order that implements it."""
from_node = "corrective_action"
to_node = "work_order"

