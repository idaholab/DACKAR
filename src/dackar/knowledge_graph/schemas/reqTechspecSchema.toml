title = "Requirement and Tech-Spec Schema"
version = "1.0"

# NOTE: This schema is superseded by mbseSchema.toml (v3.1), which provides
# the canonical requirement and technical_specification node definitions.

# ============================================================
# NODE ENTITIES
# ============================================================

[node.requirement]
node_description = "A formalized statement of a system or component function, constraint, or performance target derived from stakeholder needs or regulatory standards."
node_properties = [
  { name = "id", type = "string", optional = false, description = "Unique identifier for the requirement." },
  { name = "description", type = "string", optional = false, description = "Textual content of the requirement." },
  { name = "source", type = "string", optional = true, description = "Origin of the requirement, such as a stakeholder, regulation, or FSAR." },
  { name = "category", type = "string", optional = true, description = "Category of the requirement, such as functional, performance, or safety." },
  { name = "priority", type = "string", optional = true, description = "Importance level, such as high, medium, or low." }
]

[node.tech_spec]
node_description = "A measurable or verifiable technical attribute or constraint associated with a component, system, or function."
node_properties = [
  { name = "id", type = "string", optional = false, description = "Unique identifier for the technical specification." },
  { name = "parameter", type = "string", optional = false, description = "Name of the technical parameter, such as pressure or voltage." },
  { name = "value", type = "float", optional = false, description = "Numerical value of the specification." },
  { name = "unit", type = "string", optional = false, description = "Unit of measurement, such as psi, V, or degC." },
  { name = "tolerance", type = "string", optional = true, description = "Acceptable range or deviation." },
  { name = "source", type = "string", optional = true, description = "Document or standard from which the spec is derived." }
]

# ============================================================
# RELATIONS
# ============================================================

[relation.has_requirement]
relation_description = "Links an element to a requirement it must fulfill."
from_entity = "element_definition"
to_entity = "requirement"
relation_properties = [
  { name = "compliance_status", type = "string", optional = true, description = "Status of requirement satisfaction, such as met, unmet, or partial." },
  { name = "verification_method", type = "string", optional = true, description = "Means of verifying compliance, such as test, analysis, or inspection." }
]

[relation.has_tech_spec]
relation_description = "Associates an element with a technical specification that defines its operational or design constraints."
from_entity = "element_definition"
to_entity = "tech_spec"
relation_properties = [
  { name = "specification_type", type = "string", optional = true, description = "Type of specification, such as design, operational, or safety." },
  { name = "compliance_status", type = "string", optional = true, description = "Whether the element currently meets the specification." }
]
