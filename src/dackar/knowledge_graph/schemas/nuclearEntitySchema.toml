title = "Nuclear Entity Graph Schema"
version = "1.1"

# temporal_entity is a leaf node: it is only a target of relations defined in
# conditionReportSchema, workOrderSchema, and temporalRelationSchema (anchored_by).
#
# nuclear_entity is the text-mention / NLP-extraction layer (unresolved references
# pulled from free text). It is a target of condition_report.refers, and it also
# *grounds into* the structured model layer via the resolves_to_* relations below,
# so an extracted mention can be linked to the asset / failure concept it denotes
# (addresses ontology-assessment A4 / §4). Each resolution carries a confidence
# because grounding is an inference, not a given.

# ============================================================
# NODE ENTITIES
# ============================================================

[node.nuclear_entity]
bfo_category = "information_artifact"
node_description = "Represents a generalized nuclear-relevant entity that may be referenced in unstructured text authored by plant personnel, encompassing a broad spectrum of technical and operational subjects. These include materials, chemical elements and compounds, chemical reactions, failure modes, degradation mechanisms, and components across electrical, hydraulic, and mechanical systems."
node_properties = [
  { name = "id", type = "string", optional = false, description = "Stable unique identifier for the nuclear entity." },
  { name = "name", type = "string", optional = false, description = "Name of the nuclear entity." },
  { name = "entity_class", type = "string", optional = true, description = "Category associated with the nuclear entity, such as material, failure_mode, degradation_mechanism, or component." }
]

[node.temporal_entity]
bfo_category = "temporal_region"
node_description = "Represents any explicit or implicit reference to a point or span in time mentioned within a textual report. This includes absolute timestamps, relative expressions such as last quarter or next week, durations, and recurring intervals. This node is used to anchor events, actions, or observations in time, enabling temporal reasoning, sequencing, and timeline construction within the knowledge graph."
node_properties = [
  { name = "id", type = "string", optional = false, description = "Stable unique identifier for the temporal entity." },
  { name = "date_time", type = "string", optional = true, description = "Explicit or implicit reference to a temporal coordinate, such as an absolute timestamp or normalized date string." },
  { name = "temporal_reference", type = "string", optional = true, description = "Relative temporal expression, such as last quarter, during the outage, or next Monday." }
]

# ============================================================
# GROUNDING RELATIONS — resolve text mentions into the structured model
# (ontology-assessment A4 / §4). Typed per target so every endpoint resolves to
# a defined node label. A mention can be type-level (resolves_to_definition) or
# instance-level (resolves_to_asset); both are provided so the resolver need not
# pick an arbitrary element_usage for a type-level reference. `material` is
# intentionally NOT a target because no material node exists in the current set.
# confidence declares a [0,1] range via the meta-schema (minimum/maximum). That
# range is recorded in machine-readable form but is NOT yet enforced against
# runtime edge values at ingestion (no loader reads property bounds today), so a
# confidence outside [0,1] would still ingest. Enforcement is a schema-set
# follow-up; see SCHEMA_FOLLOWUPS.md next to this schema set.
# ============================================================

[relation.resolves_to_definition]
relation_description = "Grounds an extracted nuclear_entity mention to the type-level element_definition it denotes (e.g. a component class rather than one installed unit), linking the free-text layer to the MBSE definition layer."
from_entity = "nuclear_entity"
to_entity = "element_definition"
relation_properties = [
  { name = "confidence", type = "float", optional = true, minimum = 0.0, maximum = 1.0, description = "Resolver confidence in [0,1] that this mention denotes this element definition." },
  { name = "resolution_method", type = "enum", optional = true, description = "How the grounding was produced.", enum_values = ["exact_match", "alias", "embedding", "human_confirmed"] }
]

[relation.resolves_to_asset]
relation_description = "Grounds an extracted nuclear_entity mention to the installed plant asset it denotes, linking the free-text layer to the MBSE model layer."
from_entity = "nuclear_entity"
to_entity = "element_usage"
relation_properties = [
  { name = "confidence", type = "float", optional = true, minimum = 0.0, maximum = 1.0, description = "Resolver confidence in [0,1] that this mention denotes this asset." },
  { name = "resolution_method", type = "enum", optional = true, description = "How the grounding was produced.", enum_values = ["exact_match", "alias", "embedding", "human_confirmed"] }
]

[relation.resolves_to_failure_mode]
relation_description = "Grounds an extracted nuclear_entity mention to the failure_mode it denotes, linking the free-text layer to the reliability/FMEA layer."
from_entity = "nuclear_entity"
to_entity = "failure_mode"
relation_properties = [
  { name = "confidence", type = "float", optional = true, minimum = 0.0, maximum = 1.0, description = "Resolver confidence in [0,1] that this mention denotes this failure mode." },
  { name = "resolution_method", type = "enum", optional = true, description = "How the grounding was produced.", enum_values = ["exact_match", "alias", "embedding", "human_confirmed"] }
]

[relation.resolves_to_mechanism]
relation_description = "Grounds an extracted nuclear_entity mention to the degradation_mechanism it denotes, linking the free-text layer to the causal/degradation layer."
from_entity = "nuclear_entity"
to_entity = "degradation_mechanism"
relation_properties = [
  { name = "confidence", type = "float", optional = true, minimum = 0.0, maximum = 1.0, description = "Resolver confidence in [0,1] that this mention denotes this degradation mechanism." },
  { name = "resolution_method", type = "enum", optional = true, description = "How the grounding was produced.", enum_values = ["exact_match", "alias", "embedding", "human_confirmed"] }
]
