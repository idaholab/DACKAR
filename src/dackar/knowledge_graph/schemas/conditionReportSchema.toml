title = "Condition Report Graph Schema"
version = "1.0"

# ====================
# Node 
# ====================

[condition_report]
node_description = """Represents a structured report documenting an observed abnormal event or condition within 
                      a plant or operational environment. This entity captures descriptive information provided 
                      by plant staff, including the nature, context, and potential implications of the anomaly."""

properties = [
  { name = "cr_id", type = "string", description = "Unique condition report id", required = true },
  { name = "asset_ids", type = "array", description = "Affected assets", required = false },
  { name = "component_ids", type = "array", description = "Referenced MBSE components", required = false },
  { name = "reported_at", type = "string", description = "ISO timestamp", required = false },
  { name = "reported_by", type = "string", description = "Reporter id", required = false },
  { name = "channel", type = "string", description = "Reporting channel", required = false },
  { name = "severity", type = "string", description = "Severity", enum = ["low","medium","high","critical"], required = false },
  { name = "text", type = "string", description = "Raw or summary CR text", required = false },
  { name = "summary", type = "string", description = "NLP-extracted summary", required = false },
  { name = "attachment_refs", type = "array", description = "Images or logs", required = false },
  { name = "related_event_ids", type = "array", description = "Linked abnormal events", required = false },
  { name = "status_history", type = "array", description = "Status changes", required = false },
  { name = "created_at", type = "string", description = "ISO timestamp", required = false }
]



# ====================
# Relations
# ====================

[refers]
relation_description = """Indicates that a generalized nuclear-relevant entity such as materials, chemical elements 
                          and compounds, chemical reactions, failure modes, degradation mechanisms, and components 
                          across electrical, hydraulic, and mechanical systems has been explicitly referenced within 
                          a condition report."""
from_node = "condition_report"
to_node= "nuclear_entity"

[mentions]
relation_description = """Indicates that a specific system, equipment, or component contained in the provided MBSE model 
                          has been explicitly referenced within a condition report, establishing a contextual link between 
                          the reported abnormal event or condition and the physical or functional asset involved."""
from_node = "condition_report"
to_node = "mbse_entity"


[linked_to_report]
relation_description = """Connects this condition report to another report that is related by similarity, follow-up, or shared context."""
from_node = "condition_report"
to_node = "condition_report"
