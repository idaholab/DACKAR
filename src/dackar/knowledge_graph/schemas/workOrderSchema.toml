title = "Condition Report Graph Schema"
version = "1.0"

# ====================
# Node 
# ====================

[work_order]
node_description = """Represents a formal directive or request for maintenance, inspection, repair, or operational action 
                      within a plant or facility. Work orders are typically generated in response to observed conditions, 
                      scheduled tasks, or regulatory requirements."""

properties = [
  { name = "work_order_id", type = "string", description = "Work order id", required = true },
  { name = "requested_by", type = "string", description = "Requester id", required = false },
  { name = "crew_ids", type = "array", description = "Crew members", required = false },
  { name = "materials_used", type = "array", description = "Parts and lot info", required = false },
  { name = "tools_used", type = "array", description = "Tools used", required = false },
  { name = "actual_start", type = "string", description = "Actual start time", required = false },
  { name = "actual_end", type = "string", description = "Actual end time", required = false },
  { name = "completion_notes", type = "string", description = "Completion notes", required = false },
  { name = "inspection_photos", type = "array", description = "Photo refs", required = false },
  { name = "verification_signoff", type = "array", description = "Signoff records", required = false },
  { name = "implementation_evidence_refs", type = "array", description = "Evidence doc refs", required = false },
  { name = "resulting_state", type = "string", description = "Resulting asset state", required = false },
  { name = "created_at", type = "string", description = "ISO timestamp", required = false },
  { name = "started_at", type = "string", description = "ISO timestamp", required = false },
  { name = "completed_at", type = "string", description = "ISO timestamp", required = false }
]



# ====================
# Relations
# ====================


[addresses_condition]
relation_description = """Indicates that the work order was created in response to a specific condition report, linking the corrective or investigative action to the observed anomaly."""
from_node = "work_order"
to_node = "condition_report"

[performed_to]
relation_description = """Indicates that the work order targets a specific system, component, or asset for action, as defined in the MBSE model."""
from_node = "work_order"
to_node = "mbse_entity"

[follows_up]
relation_description = """Indicates that the work order is a follow-up to a previous work order, forming a chain of related actions or investigations."""
from_node = "work_order"
to_node = "work_order"
