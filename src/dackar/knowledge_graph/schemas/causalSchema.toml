title = "Causality Graph Schema"
version = "1.0"

# ============================================================
# NODE ENTITIES
# ============================================================

[node.degradation_mechanism]
node_description = "Represents a physical, chemical, or mechanical process that progressively deteriorates the integrity, performance, or functional capability of a component or system over time. Examples include corrosion, fatigue, wear, erosion, embrittlement, and fouling."
node_properties = [
  { name = "id",                type = "string", optional = false, description = "Stable unique identifier for the degradation mechanism." },
  { name = "name",              type = "string", optional = false, description = "Name of the degradation mechanism, such as corrosion, fatigue, or wear." },
  { name = "description",       type = "string", optional = true,  description = "Narrative explanation of how the mechanism operates and what it affects." },
  { name = "mechanism_class",   type = "enum",   optional = true,  description = "High-level classification of the degradation mechanism.", enum_values = ["mechanical", "chemical", "thermal", "electrical", "environmental", "combined"] },
  { name = "affected_material", type = "string", optional = true,  description = "Material, component type, or system class typically affected by this mechanism." }
]

# ============================================================
# RELATIONS
# ============================================================

[relation.precipitates]
relation_description = "Indicates that a degradation mechanism precipitates or leads to a specific failure mode over time."
from_entity = "degradation_mechanism"
to_entity = "failure_mode"

[relation.results_in]
relation_description = "Indicates that a failure mode resulted in a documented condition report. This relation closes the causal chain from degradation to operational record."
from_entity = "failure_mode"
to_entity = "condition_report"
