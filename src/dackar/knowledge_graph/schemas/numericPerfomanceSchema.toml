title = "Numeric Perfomance Record Graph Schema"
version = "1.0"

# ====================
# Node Entities
# ====================

[anomaly]
node_description =   """Represents a specific occurrence of an anomaly (such as threshold 
                        violations, signal deviations, or unexpected patterns) associated 
                        with a particular component, equipment, or system that have been 
                        detected by monitoring sensors coupled with an anomaly detection 
                        algorithm."""

properties = [
  { name = "anomaly_id", type = "string", description = "Anomaly id", required = true },
  { name = "detector_id", type = "string", description = "Detector id", required = false },
  { name = "score", type = "number", description = "Anomaly score", required = false },
  { name = "feature_vector_hash", type = "string", description = "Feature hash", required = false },
  { name = "detection_method", type = "string", description = "Method used", required = false },
  { name = "related_event_id", type = "string", description = "Linked abnormal_event", required = false },
  { name = "timestamp", type = "string", description = "ISO timestamp", required = false }
]

[diagnostic_assessment]
node_description = """Represents an evaluation of the current health or operational state of a system, component, or equipment, typically based on observed data, anomalies, and expert or algorithmic reasoning."""

properties = [
  { name = "diagnostic_id", type = "string", description = "Diagnostic id", required = true },
  { name = "model_version", type = "string", description = "Model version", required = false },
  { name = "input_features", type = "array", description = "Features used", required = false },
  { name = "confidence_intervals", type = "string", description = "Confidence info", required = false },
  { name = "explainability_snippet", type = "string", description = "Why this diagnosis", required = false }
]

[prognostic_assessment]
node_description = """Represents a prediction about the future health, performance, or failure likelihood of a system or component, based on current data, degradation models, or predictive analytics."""

node_properties = [
    { name = "ID", type = "string", optional = false, description = "Unique identifier for the prognostic assessment" },
    { name = "timestamp", type = "datetime", optional = false, description = "Time when the prognostic assessment was performed" },
    { name = "method", type = "string", optional = true, description = "Method or model used for the prognostic assessment" },
    { name = "predicted_failure_time", type = "datetime", optional = true, description = "Estimated time of failure or performance degradation" },
    { name = "remaining_useful_life", type = "floating", optional = true, description = "Estimated remaining useful life (RUL) in hours/days/etc." },
    { name = "confidence", type = "floating", optional = true, description = "Confidence level or uncertainty associated with the prediction" }
]

# ====================
# Relationships
# ====================

[detected_by]
relation_description =   """Defines a semantic relationship indicating that a detected anomaly 
                            (such as a deviation from expected operational behavior) was identified 
                            through the observation or analysis of a specific monitoring variable. 
                            This link establishes traceability between the anomaly instance and the 
                            physical variable that triggered its detection."""
from_node = "anomaly"
to_node = "monitored_variable"

[diagnosed_from]
relation_description = """Indicates that a diagnostic assessment is associated with a specific anomaly"""
from_node = "diagnostic_assessment"
to_node = "anomaly"

[diagnoses]
relation_description = """Indicates the candidate failure mode of the diagnostic assessment"""
from_node = "diagnostic_assessment"
to_node = "fmea_failure_mode"

[prognosticated_from]
relation_description = """Indicates that a prognostic assessment is associated with with a specific anomaly, predicting its future state."""
from_node = "prognostic_assessment"
to_node = "anomaly"