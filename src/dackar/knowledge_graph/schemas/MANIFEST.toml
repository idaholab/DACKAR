# Knowledge-graph curated schema set — manifest (SCHEMA_FOLLOWUPS #4 / A8)
#
# Single source of truth for WHICH schemas form the curated DACKAR ontology,
# their per-file versions, and their owners. Because multiple projects (RCA,
# Outage, Licensing) edit these files, this manifest gives the set one
# ontology-wide version stamp and a change-control record instead of 19
# independently drifting files.
#
# Contract (enforced by tests/knowledge_graph/test_schema_loading.py):
#   - the [[module]] list must match exactly the *.toml schema files on disk
#     (no schema added or removed without editing this manifest);
#   - each module's `version` must equal that file's own `version`.
#   `owner` is advisory (documentation), not mechanically enforced.
#
# Bump `ontology_version` by hand whenever any curated schema changes; it names
# the set as a whole (date-based: YYYY.MM, optionally .PATCH within a month).

ontology_version = "2026.11"
description = "Curated nuclear-lifecycle knowledge-graph schema set for DACKAR (RCA / Outage / Licensing)."

