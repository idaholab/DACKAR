title = "HAZOP Schema"
version = "1.0"

# ============================================================
# NODE ENTITIES
# ============================================================

[node.hazop_study]
node_description = "A structured and systematic examination of a system or process to identify potential hazards and operability issues."
node_properties = [
  { name = "id", type = "string", optional = false, description = "Stable unique identifier for the HAZOP study." },
  { name = "name", type = "string", optional = false, description = "Name or title of the HAZOP study." },
  { name = "system_scope", type = "string", optional = false, description = "System or process under analysis." },
  { name = "date", type = "string", optional = true, description = "Date the study was conducted." },
  { name = "team_lead", type = "string", optional = true, description = "Person responsible for leading the HAZOP." },
  { name = "reference_documents", type = "string", optional = true, description = "Supporting documents such as P&IDs or procedures." }
]

[node.hazop_node]
node_description = "A specific location or function in the system where deviations are analyzed, such as a valve, pump, or process step."
node_properties = [
  { name = "id", type = "string", optional = false, description = "Stable unique identifier for the HAZOP node." },
  { name = "name", type = "string", optional = false, description = "Name or label of the HAZOP node." },
  { name = "description", type = "string", optional = true, description = "Narrative of the node's function or location." }
]

[node.deviation]
node_description = "A deviation from design intent, typically defined by a guideword and process parameter such as No Flow."
node_properties = [
  { name = "id", type = "string", optional = false, description = "Stable unique identifier for the deviation." },
  { name = "guideword", type = "string", optional = false, description = "Guideword used, such as No, More, Less, or Reverse." },
  { name = "parameter", type = "string", optional = false, description = "Process variable, such as flow, pressure, or temperature." },
  { name = "description", type = "string", optional = true, description = "Explanation of the deviation." }
]

[node.cause]
node_description = "Represents a root cause or contributing factor that can lead to the occurrence of a failure mode. Canonical definition in fmeaSchema.toml."
node_properties = [
  { name = "id",         type = "string", optional = false, description = "Stable unique identifier for the cause." },
  { name = "name",       type = "string", optional = true,  description = "Short human-readable label for the cause." },
  { name = "cause_type", type = "enum",   optional = true,  description = "Categorization of the cause.", enum_values = ["technical", "human", "organizational", "environmental", "unknown"] },
  { name = "description", type = "string", optional = true, description = "Detailed explanation of the cause." }
]

[node.consequence]
node_description = "The potential outcome or impact if the deviation occurs."
node_properties = [
  { name = "id", type = "string", optional = false, description = "Stable unique identifier for the consequence." },
  { name = "description", type = "string", optional = false, description = "Narrative of the consequence." },
  { name = "severity", type = "enum", optional = true, description = "Severity classification of the consequence.", enum_values = ["negligible", "marginal", "critical", "catastrophic"] }
]

[node.safeguard]
node_description = "An existing control or mitigation that reduces the likelihood or impact of the deviation."
node_properties = [
  { name = "id", type = "string", optional = false, description = "Stable unique identifier for the safeguard." },
  { name = "description", type = "string", optional = false, description = "Description of the safeguard." },
  { name = "safeguard_type", type = "enum", optional = true, description = "Type of safeguard.", enum_values = ["alarm", "interlock", "procedure", "barrier", "relief_device", "administrative_control", "mitigation", "other"] }
]

[node.recommendation]
node_description = "A proposed action to address an identified hazard or operability issue."
node_properties = [
  { name = "id", type = "string", optional = false, description = "Stable unique identifier for the recommendation." },
  { name = "text", type = "string", optional = false, description = "Text of the recommendation." },
  { name = "status", type = "enum", optional = true, description = "Implementation status.", enum_values = ["open", "in_progress", "closed"] }
]

# ============================================================
# RELATIONS
# ============================================================

[relation.part_of_study]
relation_description = "Links a HAZOP node to the overall HAZOP study."
from_entity = "hazop_node"
to_entity = "hazop_study"

[relation.has_deviation]
relation_description = "Connects a HAZOP node to a deviation being analyzed."
from_entity = "hazop_node"
to_entity = "deviation"

[relation.caused_by]
relation_description = "Links a deviation to its potential cause."
from_entity = "deviation"
to_entity = "cause"

[relation.leads_to]
relation_description = "Links a deviation to its potential consequence."
from_entity = "deviation"
to_entity = "consequence"

[relation.mitigated_by]
relation_description = "Connects a consequence to an existing safeguard."
from_entity = "consequence"
to_entity = "safeguard"

[relation.has_recommendation]
relation_description = "Links a deviation or consequence to a recommendation for corrective action."
from_entity = "deviation"
to_entity = "recommendation"
