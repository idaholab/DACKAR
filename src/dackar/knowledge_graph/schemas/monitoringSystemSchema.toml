title = "Monitoring System Graph Schema"
version = "1.0"

# ====================
# Node Entities
# ====================

[monitored_variable]
node_description =   """Represents a measurable physical variable that is continuously or periodically recorded by monitoring 
                        sensors from a specific component, equipment, or system. This entity captures dynamic operational 
                        data that reflects the real-time or historical state of the asset, enabling monitoring, diagnostics, 
                        performance analysis, and integration with predictive models or digital twins within engineering and 
                        plant operations contexts."""
properties = [
  { name = "variable_id", type = "string", description = "Variable id", required = true },
  { name = "sensor_id", type = "string", description = "Sensor id", required = false },
  { name = "channel_id", type = "string", description = "Source channel id", required = false },
  { name = "units", type = "string", description = "Units", required = false },
  { name = "sampling_rate_hz", type = "number", description = "Sampling rate", required = false },
  { name = "derived_metric", type = "boolean", description = "True if computed", required = false },
  { name = "preprocessing", type = "string", description = "Preprocessing applied", required = false },
  { name = "feature_extractors", type = "array", description = "Feature extractors list", required = false },
  { name = "calibration_due", type = "string", description = "Calibration due date", required = false },
]

# ====================
# Relationships
# ====================

[monitors]
relation_description =   """Defines a semantic relationship in which a monitoring variable is associated with the performance 
                            monitoring of a specific component, equipment, or system. This relation captures the functional 
                            linkage between sensor-derived data and the operational behavior of 
                            the asset, enabling performance assessment, anomaly detection, and predictive maintenance. 
                            It supports traceability between real-time or historical measurements and the physical or logical entities 
                            they characterize within the system model."""
from_node = "monitored_variable"
to_node = "mbse_entity"
