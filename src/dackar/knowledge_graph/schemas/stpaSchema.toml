title = "STPA Schema"
version = "1.0"

# ============================================================
# NODE ENTITIES
# ============================================================

[node.control_structure]
node_description = "A representation of the system's control architecture, including controllers, actuators, sensors, and controlled processes."
node_properties = [
  { name = "id",          type = "string", optional = false, description = "Stable unique identifier for the control structure." },
  { name = "name",        type = "string", optional = false, description = "Name or title of the control structure." },
  { name = "description", type = "string", optional = true,  description = "Narrative of the control structure's purpose and scope." }
]

[node.controller]
node_description = "A system component that issues control actions to influence the behavior of a process or component."
node_properties = [
  { name = "id", type = "string", optional = false, description = "Stable unique identifier for the controller." },
  { name = "name", type = "string", optional = false, description = "Name or label of the controller." },
  { name = "controller_type", type = "string", optional = true, description = "Type of controller, such as human, software, or hardware." }
]

[node.control_action]
node_description = "An action issued by a controller to influence the controlled process."
node_properties = [
  { name = "id", type = "string", optional = false, description = "Stable unique identifier for the control action." },
  { name = "name", type = "string", optional = false, description = "Name of the control action." },
  { name = "description", type = "string", optional = true, description = "Narrative of the action's intent." }
]

[node.unsafe_control_action]
node_description = "A control action that, under certain conditions, can lead to a hazardous state."
node_properties = [
  { name = "id", type = "string", optional = false, description = "Stable unique identifier for the unsafe control action." },
  { name = "description", type = "string", optional = false, description = "Description of the unsafe control action." },
  { name = "uca_type", type = "enum", optional = true, description = "Type of unsafe control action per STAMP methodology.", enum_values = ["not_provided", "provided_incorrectly", "too_early_or_too_late", "stopped_too_soon"] }
]

[node.hazard]
node_description = "A system state or condition that, together with a particular set of worst-case environmental conditions, will lead to an accident."
node_properties = [
  { name = "id", type = "string", optional = false, description = "Stable unique identifier for the hazard." },
  { name = "description", type = "string", optional = false, description = "Narrative of the hazard." }
]

# loss (STPA terminology) is represented by the canonical consequence node
# defined in hazopSchema.toml and cross-referenced here via the leads_to relation.

[node.safety_constraint]
node_description = "A requirement or rule that must be enforced to prevent unsafe control actions and hazards."
node_properties = [
  { name = "id", type = "string", optional = false, description = "Stable unique identifier for the safety constraint." },
  { name = "text", type = "string", optional = false, description = "Text of the safety constraint." }
]

# ============================================================
# RELATIONS
# ============================================================

[relation.issues]
relation_description = "Links a controller to the control actions it issues."
from_entity = "controller"
to_entity = "control_action"

[relation.part_of_structure]
relation_description = "Links a controller to the control structure it belongs to."
from_entity = "controller"
to_entity = "control_structure"

[relation.has_unsafe_variant]
relation_description = "Links a control action to its unsafe variant."
from_entity = "control_action"
to_entity = "unsafe_control_action"

[relation.leads_to_hazard]
relation_description = "Links an unsafe control action to a hazard it may cause."
from_entity = "unsafe_control_action"
to_entity = "hazard"

[relation.leads_to_consequence]
relation_description = "Links a hazard to a potential consequence or loss resulting from that hazard."
from_entity = "hazard"
to_entity = "consequence"

[relation.prevented_by]
relation_description = "Links a hazard or unsafe control action to the safety constraint that prevents it."
from_entity = "hazard"
to_entity = "safety_constraint"

[relation.enforces]
relation_description = "Links a controller to the safety constraints it is responsible for enforcing."
from_entity = "controller"
to_entity = "safety_constraint"
