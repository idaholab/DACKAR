title = "MBSE Graph Schema"
version = "1.1"

# ====================
# Node Entities
# ====================

[mbse_entity]
description = "Design-time MBSE entity (system, subsystem, component, interface)."
properties = [
  { name = "id", type = "string", description = "Canonical MBSE element id (unique)", required = true },
  { name = "name", type = "string", description = "Human-readable name", required = true },
  { name = "type", type = "string", description = "Entity type", enum = ["system","subsystem","component","interface","assembly"], required = true },
  { name = "model_ref", type = "string", description = "Reference/URI to MBSE model element", required = false },
  { name = "description", type = "string", description = "Long-form description", required = false },
  { name = "version", type = "string", description = "Model version or revision", required = false },
  { name = "created_at", type = "string", description = "ISO8601 creation timestamp", required = false },
  { name = "updated_at", type = "string", description = "ISO8601 last update timestamp", required = false }
]

[asset]
description = "Operational instance of a MBSE component; asset-level information where telemetry and work orders attach."
properties = [
  { name = "asset_id", type = "string", description = "Unique asset identifier", required = true },
  { name = "mbse_id", type = "string", description = "MBSE entity id realized by this asset", required = false },
  { name = "model_id", type = "string", description = "Model number", required = false },
  { name = "serial_number", type = "string", description = "Manufacturer serial", required = false },
  { name = "location_id", type = "string", description = "Physical location", required = false },
  { name = "status", type = "string", description = "Operational status", enum = ["active","inactive","under_maintenance","decommissioned"], required = false },
  { name = "commissioned_at", type = "string", description = "ISO datetime asset commissioned", required = false },
  { name = "tags", type = "array", description = "Freeform tags", required = false },
  { name = "created_at", type = "string", description = "ISO timestamp", required = false },
  { name = "updated_at", type = "string", description = "ISO timestamp", required = false }
]

[function]
node_description = "Represents a function within the component, equipment, or system describing its operational behavior or purpose"
properties = [
    { name = "name", type = "string", optional = false, description = "Name of the function" },
    { name = "description", type = "string", optional = true, description = "Description of the function's purpose" },
    { name = "criticality", type = "enum", optional = true, description = "Importance of the function to system operation", enum_values = ["low", "medium", "high", "mission_critical"] },
    { name = "mode", type = "enum", optional = true, description = "Mode of function execution", enum_values = ["automatic", "manual", "hybrid"] }
]

[interface_entity]
node_description = "Represents a defined interface used for communication or integration between MBSE entities."
properties = [
    { name = "ID", type = "string", optional = false, description = "Unique identifier for the interface" },
    { name = "protocol", type = "string", optional = true, description = "Communication protocol or standard used" },
    { name = "direction", type = "enum", optional = true, description = "Direction of data or control flow", enum_values = ["input", "output", "bidirectional"] }
]

# ====================
# Relationships
# ====================

[realizes]
description = "Asset REALIZES a MBSE entity (instance-to-design mapping)"
from = "asset"
to = "mbse_entity"
properties = [
  { name = "installed_since", type = "string", description = "ISO date since installation", required = false },
  { name = "provenance", type = "string", description = "Source system or doc id", required = false }
]

[functional_dependency]
relation_description = "Represents a functional relationship between two MBSE entities where one influences or enables the other."
from_node = "mbse_entity"
to_node = "mbse_entity"

[composition]
relation_description = "Denotes a hierarchical or structural relationship where one MBSE entity is a constituent part of another."
from_node = "mbse_entity"
to_node = "mbse_entity"

[support]
relation_description = "Indicates a non-hierarchical relationship where one MBSE entity provides auxiliary functionality or services to another."
from_node = "mbse_entity"
to_node = "mbse_entity"


[performs_function]
relation_description = "Indicates that an MBSE entity dynamically performs a function."
from_node = "mbse_entity"
to_node = "function"

[decomposes]
relation_description = "Indicates that a function is decomposed into sub-functions."
from_node = "function"
to_node = "function"

[has_interface]
relation_description = "Indicates that an MBSE entity uses or exposes a defined interface."
from_node = "mbse_entity"
to_node = "interface_entity"
