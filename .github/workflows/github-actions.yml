name: GitHub DACKAR test
run-name: ${{ github.actor }} is testing out DACKAR
on: [push, pull_request]

concurrency:
  # head_ref is set only for pull_request events; on push it is empty, which GitHub
  # rejects as a concurrency group. Fall back to github.ref so the value is never empty,
  # and prefix with github.workflow to avoid colliding with other workflows.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  Test-DACKAR-Linux:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and Branch
        uses: actions/checkout@v4

      - name: Job Information
        run: |
          echo " The job was automatically triggered by a ${{ github.event_name }} event."
          echo " This job is now running on a ${{ runner.os }} server"
          echo " The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Installs every dependency group from pyproject.toml (torch CPU wheels are
      # routed per-OS via [tool.uv.sources]). Replaces the conda + pip install list.
      - name: Install DACKAR Required Libraries
        run: uv sync --python 3.11 --all-groups

      # nltk corpora, the wn (oewn:2024) lexicon for pywsd >=1.3, and the quantulum3
      # classifier retrain. The en_core_web_lg model is a URL dep in pyproject.toml,
      # so uv sync already installed it.
      - name: Download trained models
        run: uv run python scripts/bootstrap_models.py

      - name: Test
        working-directory: tests
        run: uv run pytest

  Test-DACKAR-Macos:
    runs-on: macos-latest
    steps:
      - name: Fetch and Branch
        uses: actions/checkout@v4

      - name: Job Information
        run: |
          echo " The job was automatically triggered by a ${{ github.event_name }} event."
          echo " This job is now running on a ${{ runner.os }} server"
          echo " The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install DACKAR Required Libraries
        run: uv sync --python 3.11 --all-groups

      - name: Download trained models
        run: uv run python scripts/bootstrap_models.py

      - name: Test
        working-directory: tests
        run: uv run pytest

  Test-DACKAR-Windows:
    runs-on: windows-2025
    steps:
      - name: Fetch and Branch
        uses: actions/checkout@v4

      - name: Job Information
        run: |
          echo " The job was automatically triggered by a ${{ github.event_name }} event."
          echo " This job is now running on a ${{ runner.os }} server"
          echo " The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Windows pins torch 2.8.0 (pytorch #166628) via platform markers in pyproject.toml.
      - name: Install DACKAR Required Libraries
        run: uv sync --python 3.11 --all-groups

      - name: Download trained models
        run: uv run python scripts/bootstrap_models.py

      - name: Test
        working-directory: tests
        run: uv run pytest

  Test-DACKAR-Macos-py312:
    runs-on: macos-latest
    steps:
      - name: Fetch and Branch
        uses: actions/checkout@v4

      - name: Job Information
        run: |
          echo " The job was automatically triggered by a ${{ github.event_name }} event."
          echo " This job is now running on a ${{ runner.os }} server"
          echo " The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # editdistance on 3.12 is built from a GitHub source pinned in pyproject.toml
      # ([tool.uv.sources]); the PyPI sdist for its 0.6.2 pin can't build on 3.12.
      - name: Install DACKAR Required Libraries
        run: uv sync --python 3.12 --all-groups

      - name: Download trained models
        run: uv run python scripts/bootstrap_models.py

      - name: Test
        working-directory: tests
        run: uv run pytest

  # Optional non-uv install path (conda provides Python, pip installs the project),
  # tested on Linux only; the uv jobs above already cover macOS and Windows.
  Test-DACKAR-Conda-Pip-Linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}          # login shell so `conda activate` works
    steps:
      - name: Fetch and Branch
        uses: actions/checkout@v4

      - name: Job Information
        run: |
          echo " The job was automatically triggered by a ${{ github.event_name }} event."
          echo " This job is now running on a ${{ runner.os }} server"
          echo " The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."

      - name: Set up conda (Python 3.11)
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.11"
          activate-environment: dackar
          auto-activate-base: false

      # CPU torch from the pytorch index (matches the uv CPU routing and avoids the
      # large default CUDA wheel from PyPI). 'pip install .' then finds it satisfied.
      - name: Install CPU torch
        run: pip install "torch==2.9.1" --index-url https://download.pytorch.org/whl/cpu

      # Plain pip install, no uv. Core deps cover the full test suite; the
      # en_core_web_lg model is a URL dep in pyproject.toml and installs here too.
      - name: Install DACKAR (pip)
        run: pip install .

      - name: Download trained models
        run: python scripts/bootstrap_models.py

      - name: Test
        working-directory: tests
        run: pytest
